name: sdk-ci

on:
  pull_request:
    paths: ["sdk/**", "semantic_router/**", "tests/**", ".github/workflows/sdk-*.yml"]
  push:
    branches: [main]
    paths: ["sdk/**", "semantic_router/**", "tests/**", ".github/workflows/sdk-*.yml"]

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest tests

  build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the built wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/gw --version
          /tmp/smoke/bin/gw chat "ping" --local --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist/

  # The SDK against the real gateway app (auth, RBAC, SSE, response_format).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_api.py tests/test_streaming_structured.py tests/test_sdk_integration.py -q

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SDK source changes need a CHANGELOG entry
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^sdk/src/' && ! echo "$changed" | grep -q '^sdk/CHANGELOG.md$'; then
            echo "::error::sdk/src changed but sdk/CHANGELOG.md did not. Add a line under [Unreleased]."
            exit 1
          fi
