name: sdk-release

# Release = push a tag named sdk-vX.Y.Z whose version matches __version__ and CHANGELOG.md.
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, version and changelog agree
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest tests

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure this environment in the repo settings: required reviewers + the three secrets below.
    environment: internal-package-index
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install twine
      - name: Upload to the internal index
        env:
          TWINE_REPOSITORY_URL: ${{ secrets.INTERNAL_INDEX_UPLOAD_URL }}
          TWINE_USERNAME: ${{ secrets.INTERNAL_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.INTERNAL_INDEX_TOKEN }}
        run: twine upload --non-interactive dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python sdk/scripts/check_release.py --notes > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "gateway-client ${GITHUB_REF_NAME#sdk-v}" --notes-file notes.md
