[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateway-client"
dynamic = ["version"]
description = "Python SDK for the enterprise AI gateway: retries, streaming, structured output, local eval mode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.5", "jsonschema>=4.18"]

[project.scripts]
gw = "gateway_client.cli:main"

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy", "pyyaml>=6"]

[tool.hatch.version]
path = "src/gateway_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "yaml.*"]
ignore_missing_imports = true
